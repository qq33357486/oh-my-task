name: Functional QA

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  CI: true

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Functional QA (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Install Droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Run functional QA
        id: qa
        continue-on-error: true
        timeout-minutes: 20
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          mkdir -p qa-results
          droid exec --auto high "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, do NOT pause for input. Run the qa skill for this repository against the local environment. Functional QA must start from zero with a fresh temporary DB_PATH and exactly one unified HTTP port: http://localhost:17173 for browser, API, and MCP. Build backend and web, start node dist/index.js with WEB_DIST_PATH=web/dist and API_PORT=17173, then write the final report to qa-results/report.md." | tee qa-results/qa-output.txt

      - name: Ensure report exists
        if: always()
        run: |
          mkdir -p qa-results
          if [ ! -f qa-results/report.md ]; then
            {
              echo "## QA Report"
              echo
              echo "| # | Test Case | App | Persona | Result | Notes |"
              echo "| --- | --- | --- | --- | --- | --- |"
              echo "| 1 | QA execution | all | n/a | :no_entry: BLOCKED | qa-results/report.md was not generated. See qa-output.txt artifact. |"
              echo
              echo "<details><summary>Screenshots & Evidence</summary>"
              echo
              echo '```text'
              tail -200 qa-results/qa-output.txt 2>/dev/null || true
              echo '```'
              echo
              echo "</details>"
            } > qa-results/report.md
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: qa-results/
          retention-days: 14

      - name: Post QA report as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REPORT="$(cat qa-results/report.md)"
          case "$REPORT" in
            "## QA Report"*) ;;
            *) REPORT="## QA Report

$REPORT" ;;
          esac
          BODY="<!-- qa-report -->
$REPORT

---
Artifacts: see the \`qa-results\` workflow artifact. Workflow run: $RUN_URL"
          COMMENTS=$(gh api repos/$REPO/issues/$PR_NUMBER/comments)
          COMMENT_ID=$(echo "$COMMENTS" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const comments=JSON.parse(s);const c=comments.find(x=>(x.body||'').startsWith('<!-- qa-report -->')); if(c) console.log(c.id)})")
          printf '%s' "$BODY" > qa-results/pr-comment.md
          if [ -n "$COMMENT_ID" ]; then
            gh api repos/$REPO/issues/comments/$COMMENT_ID -X PATCH -f body=@qa-results/pr-comment.md
          else
            gh api repos/$REPO/issues/$PR_NUMBER/comments -f body=@qa-results/pr-comment.md
          fi
