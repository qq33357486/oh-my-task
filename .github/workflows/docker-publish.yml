# 推送 master：以仓库根为上下文构建镜像并发布到 GHCR。
# 镜像名必须全小写，所以先校验仓库名。
name: docker-publish

on:
  push:
    branches: [master]

jobs:
  # 先跑测试和类型检查，过了才构建发布。框架名单、待办的数法这些规矩都靠测试守着。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 测试和类型检查
        working-directory: app
        run: |
          npm ci
          npm test
          npm run typecheck

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: 校验镜像名小写（GHCR 要求仓库路径全小写）
        run: |
          case "${GITHUB_REPOSITORY}" in
            *[A-Z]*)
              echo "仓库名含大写：${GITHUB_REPOSITORY}，GHCR 镜像名必须全小写";
              exit 1;;
            *) echo "镜像名可用: ghcr.io/${GITHUB_REPOSITORY}";;
          esac

      - name: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
